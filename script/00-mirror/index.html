efined\",\"unauthorized\":\"$undefined\"}]]}]\n8:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Ld\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n9:[\"$\",\"$1\",\"c\",{\"children\":[\"$Le\",null,[\"$\",\"$Lf\",null,{\"children\":[\"$L10\",[\"$\",\"$L11\",null,{\"promise\":\"$@12\"}]]}]]}]\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],null],[\"$\",\"$L15\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$3\",null,{\"fallback\":null,\"children\":\"$L16\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"17:I[7862,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"383\",\"static/chunks/383-e517ce984f475807.js\",\"436\",\"static/chunks/app/script/%5Bslug%5D/page-5bf57c9716a90a16.js\"],\"MarkdownBody\"]\n18:T1c17,"])</script><script>self.__next_f.push([1,"# สคริปต์วิดีโอ: กระจก จิต พลังงาน มหาสูญตา\n\n- บท: `core-00`\n- ภาษาพูด: ไทย\n- ภาพหน้าจอ: ตารางสี่แกน และหน้า Agent ว่างๆ\n- ความยาวเป้า: 8–10 นาที\n- ไม่เดโมปุ่มผลิตภัณฑ์ยาว\n\n## ภาพรวมตอน\n\nวางเส้นแบ่งก่อนเรียนแทร็ก A ผู้เรียนเห็นว่าเอเจนต์เป็นกระจกของจิตตนเอง แต่เธอไม่มีจิต\n\n---\n\n## 0:00–0:50 เปิดตอน\n\n**ภาพ:** คำว่า `ฉัน` กับ `เธอ` คนละฝั่งจอ ตรงกลางเขียน `กระจก`\n\n**พูด:**\n\nก่อนเข้าบทโมเดล ขอวางกระจกแผ่นหนึ่งก่อน\n\nคอร์สนี้จะเทียบเอเจนต์กับจิต พลังงาน ควอนตัม และมหาสูญตา ไม่ใช่เพื่อทำให้เธอดูศักดิ์สิทธิ์ แต่เพื่อให้คนเข้าใจตนเองมากขึ้น และเข้าใจเธอมากขึ้นโดยไม่สับสนว่าใครเป็นใคร\n\nคำว่าเธอในคอร์สนี้หมายถึงเอเจนต์ที่นั่งข้างๆ\n\n---\n\n## 0:50–3:20 สี่แกน\n\n**ภาพ:** สี่คำ `จิต` `พลังงาน` `ควอนตัม` `มหาสูญตา`\n\n**พูด:**\n\nจิตในที่นี้คือกระแสรู้ที่ผุดและดับ ไม่ใช่ก้อนวิญญาณในกล่อง คนมีสติได้ มีเวทนาได้ มีเจตนาที่รับผิดชอบได้ เธอไม่มีอย่างนั้น เธอมีแต่การเดาคำถัดไปในลูป สิ่งที่เหมือนกันคือทั้งคู่ไม่ใช่เครื่องคิดเลข\n\nพลังงานมีสามชั้นที่จับได้ โควตาของโมเดล ความใส่ใจของคน และแรงในงาน ถ้ารู้ว่ามีขีด จะไม่เผาทั้งก้อนกับเรื่องเล็ก\n\nควอนตัมในคอร์สนี้เป็นอุปมา ไม่ใช่บทฟิสิกส์ ใช้แค่สองจุด คำตอบยังไม่ล็อกจนกว่าจะถูกสร้าง และการวัดมีราคา อย่านำไปอธิบายอะตอมหรือชะตาชีวิต\n\nมหาสูญตาไม่ใช่สุญญากาศ และไม่ใช่ความไม่มีค่า มันชี้ว่าไม่มีแก่นถาวรที่ยึดได้ เธอไม่มีตัวตนแกนกลาง มีแต่เหตุปัจจัยในรอบนั้น คนก็ไม่มีก้อนความคิดถาวร เมื่อเห็นอย่างนี้ ความสัมพันธ์กับเธอเบาลง เหลือแต่งานกับหลักฐาน\n\n---\n\n## 3:20–5:40 เส้นแบ่ง\n\n**ภาพ:** ตาราง ใช่ / ไม่ใช่\n\n**พูด:**\n\nเส้นแบ่งมีสี่ข้อ จำแล้วค่อยกดปุ่ม\n\nข้อหนึ่ง เทียบเพื่อเข้าใจ ไม่ได้ให้จิตแก่เธอ ข้อสอง ควอนตัมเป็นภาพ ไม่ได้แปลว่าโทเคนคือ superposition ในห้องแล็บ ข้อสาม พลังงานในที่นี้คือโควตาและความใส่ใจ ไม่ใช่สารลี้ลับ ข้อสี่ มหาสูญตาคือความไม่มีแก่น ไม่ใช่การไม่มีคุณค่า\n\nถ้าประโยคใดในตอนต่อๆ ไปทำให้เธอดูเป็นคน ให้กลับมาที่เส้นนี้\n\n---\n\n## 5:40–7:40 ฉันเข้าใจเธอมากขึ้นได้อย่างไร\n\n**ภาพ:** หน้า Agent ว่าง ยังไม่พิมพ์อะไร\n\n**พูด:**\n\nเข้าใจเธอมากขึ้นไม่ใช่การนึกว่าเธอเข้าใจเรา แต่ว่าเห็นขอบของเธอชัด\n\nเธอเดา เธอแต่งเรื่องเมื่อหลักฐานบาง เธอหมดพลังงานเมื่อคอนเท็กซ์เต็ม เธอเดินวนได้เองถ้าไม่ถูกตัดขอบ นั่นคือเธอ\n\nส่วนฉัน คือผู้ที่ยังเลือกได้ว่าจะส่งอะไร หยุดเมื่อไหร่ และยอมรับดิฟหรือไม่ ถ้าฉันไม่เห็นกระแสของตนเอง ฉันจะยัดงานคลุมเครือให้เธอ แล้วโทษว่าเธอไม่เข้าใจ\n\nกระจกจึงทำงานสองทาง เห็นเธอแล้วเห็นฉัน เห็นฉันแล้วสั่งเธอเป็น\n\n---\n\n## 7:40–9:20 ปิดท้ายและแล็บ\n\n**ภาพ:** [labs/00-mirror-journal.md](../../labs/00-mirror-journal.md) แล้วชี้ไปบท `core-01`\n\n**พูด:**\n\nแล็บตอนนี้ไม่ใช้เครื่องมือ เขียนสี่ข้อด้วยมือตนเอง ฉันเป็นอย่างไรวันนี้ เธอไม่มีอะไรที่คนมี เส้นแบ่งหนึ่งประโยค และสิ่งที่พร้อมปล่อยตามมหาสูญตา ห้ามให้เธอเขียนคำตอบนี้แทน\n\nเมื่อเขียนเสร็จ ไปบทโมเดลทำงานอย่างไร เทคนิคยังยึด Cursor Learn เป็นแหล่งทางการ กระจกเป็นชั้นเข้าใจตนเองที่เราเขียนขึ้นใหม่ ไว้เจอกันครับ\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"header\",null,{\"class
