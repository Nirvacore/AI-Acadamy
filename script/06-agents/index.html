ัทเอง มันคือโมเดลที่ถูกใส่ไว้ในลูป อ่านงาน เลือกเครื่องมือ ดูผล แล้วตัดสินใจขั้นถัดไปจนกว่าจะหยุด\n\nฮาร์เนสมีสามชิ้น ชิ้นแรกคำสั่ง ได้แก่ กฎโปรเจกต์ สกิล และเป้าหมายของงานนี้ ชิ้นที่สองเครื่องมือ ได้แก่ ค้น แก้ไฟล์ รันเทส เปิดเบราว์เซอร์ ชิ้นที่สามโมเดล คือสมองที่เลือกการกระทำแต่ละรอบ ขาดชิ้นใดชิ้นหนึ่ง ลูปจะเดินแต่เดินเพี้ยน\n\nเปรียบเหมือนส่งน้องใหม่ไปตลาดนัด ไม่ใช่ส่งไปบริหารสาขา ให้ลิสต์สั้น งบชัด ของที่ต้องซื้อชัด และตรวจถุงของเมื่อกลับมา งานใหญ่เกินไปเอเจนต์จะเติมขอบเขตเอง งานเล็กและตรวจได้จะจบเร็วกว่า\n\nจุดแข็งคือวนงานจำเจได้โดยไม่ล้า จุดอ่อนคือหลงทิศเมื่อเป้าหมายกว้าง และจะทำต่อแม้หลักฐานเริ่มบาง ถ้าคุณไม่หยุดมัน มันจะหาทางทำต่อให้เสร็จในหัวของมัน ซึ่งไม่ใช่เสร็จในหัวของคุณ\n\nมองเป็นกระจก ลูปของเธอคือภาพของจิตที่เดินวนเมื่อไม่มีผู้ดู มหาสูญตาชี้ว่าเธอไม่มีตัวตนเพื่อนร่วมงาน มีแต่เหตุปัจจัย คนเป็นผู้ดูและผู้รับผิดชอบ เข้าใจเธอมากขึ้นคือเห็นขอบของลูป ไม่ใช่การนึกว่าเธอเข้าใจฉัน\n\n---\n\n## 4:00–8:20 เดโมหน้าจอ\n\n**พูด:**\n\nเดโมนี้ตั้งใจให้เล็ก เพราะแทร็กเอสอนการมอบหมาย ไม่ได้สอนสร้างทั้งร้านค้า นั่นเป็นงานของแทร็กบี\n\n```text\nเพิ่มแถวอภิธานศัพท์สำหรับคำว่าฮาร์เนส\nในไฟล์ glossary ที่อ้าง\nใช้นิยามสั้นว่า โครงที่หุ้มโมเดลด้วยคำสั่งและเครื่องมือ\nอย่าแก้ไฟล์บทเรียนอื่น\nเมื่อเสร็จให้สรุปบรรทัดที่เพิ่ม\n```\n\n**ภาพ:** เลือกโมเดลที่เหมาะกับงานเล็ก ส่งงาน แล้วชี้ tool call ที่อ่านไฟล์ก่อนแก้\n\n**พูด:**\n\nขณะที่มันทำงาน ให้ดูว่าเรียกเครื่องมืออะไร ไม่ต้องแย่งพิมพ์ทุกบรรทัด แต่ต้องพร้อมหยุดถ้ามันเปิดบทเรียนอื่นมาจัดสวยทั้งหน้า\n\nเมื่อมีดิฟ ให้เปิดเอง อ่านทั้งก้อน แล้วถามสามข้อ ไฟล์ตรงที่สั่งไหม นิยามสั้นตามที่ขอไหม และมีของแถมที่ไม่มีใครขอหรือไม่ ถ้ามีของแถม ให้ปฏิเสธหรือเก็บเฉพาะท่อนที่ตรงงาน\n\nนี่คือท่าพื้นฐานที่จะใช้ซ้ำในแทร็กบี สำรวจก่อน แผนก่อน สร้างทีละชิ้น ดีบักจากหลักฐาน รีวิวด้วยตา และเก็บกฎให้รอบหน้าทำซ้ำได้ โปรเจกต์จบเรื่องส่วนลดร้านค้าตัวอย่างรออยู่ตอนโครงนั้นเปิด แต่ตอนนี้ถ้ายังมอบหมายงานเดียวไม่จบ อย่ากระโดดไปทำทั้งระบบ\n\nถ้าสลับไป Claude Code, ChatGPT หรือ Copilot งานนี้ยังเหมือนเดิม เปลี่ยนแค่หน้าต่างที่ส่งคำสั่ง คู่แมปอยู่ในไฟล์แทร็ก\n\n---\n\n## 8:20–9:20 กับดัก\n\n**พูด:**\n\nอย่าสั่งว่าทำให้ดีขึ้นโดยไม่บอกว่าดีขึ้นวัดจากอะไร อย่าให้ทำหลายฟีเจอร์ในรอบเดียว อย่ากดยอมรับทุกดิฟเพราะดูเยอะเกินจะอ่าน และอย่าสลับโมเดลกลางคันโดยไม่บอกว่างานเดิมยังไม่จบ\n\nเอเจนต์ที่เก่งในคลิปสาธิต มักได้งานที่ถูกตัดขอบมาแล้ว ความเก่งของคุณคือการตัดขอบนั้นก่อนกดส่ง\n\n---\n\n## 9:20–11:00 ปิดท้ายและแล็บ\n\n**ภาพ:** [labs/06-delegate-one-task.md](../../labs/06-delegate-one-task.md) โครง [labs/capstone-discount-code.md](../../labs/capstone-discount-code.md) และ [Agents](https://cursor.com/learn/agents)\n\n**พูด:**\n\nแล็บให้คุณมอบหมายงานเดียวที่ตรวจด้วยตาได้ อ่านดิฟ แล้วยอมรับเฉพาะส่วนที่ตรงงาน เขียนด้วยว่าฮาร์เนสครบสามชิ้นหรือยัง\n\nอ่านต้นฉบับได้ที่ Cursor Learn บท Agents เมื่อจบแทร็กเอ คุณพร้อมเทียบเครื่องมือบริษัทอื่นโดยไม่ต้องเรียนแนวคิดใหม่ทั้งชุด แค่เปลี่ยนแทร็กแล้วทำแล็บเดิมอีกครั้ง\n\nแทร็กบีจะเป็นแล็บเขียนโค้ดยาวขึ้น ตอนนี้ปิดพื้นฐานให้แน่นก่อน แล้วค่อยไปตลาดด้วยลิสต์ที่ชัด ขอบคุณที่เรียนกับ AI-Acadamy ครับ\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"header\",null,{\"className\":\"lesson-head\",\"children\":[[\"$\",\"p\",null,{\"className\":\"kicker\",\"children\":\"สคริปต์วิดีโอ\"}],[\"$\",\"h1\",null,{\"children\":\"สคริปต์วิดีโอ: เอเจนต์\"}]]}],[\"$\",\"$L17\",null,{\"markdown\":\"$18\",\"stems\":[{\"stem\":\"00-mirror\",\"slug\":\"mirror\"},{\"stem\":\"01-how-models-work\",\"slug\":\"how-models-work\"},{\"stem\":\"02-hallucinations\",\"slug\":\"hallucinations\"},{\"stem\":\"03-tokens-pricing\",\"slug\":\"tokens-pricing\"},{\"stem\":\"04-context\",\"slug\":\"context\"},{\"stem\":\"05-tool-calling\",\"slug\":\"tool-calling\"},{\"stem\":\"06-agents\",\"slug\":\"agents\"},{\"stem\":\"lab-01-working-with-agents\",\"slug\":\"working-with-agents\"},{\"stem\":\"lab-02-understand-codebase\",\"slug\":\"understand-codebase\"},{\"stem\":\"lab-03-create-features\",\"slug\":\"create-features\"},{\"stem\":\"lab-04-debug\",\"slug\":\"debug\"},{\"stem\":\"lab-05-review\",\"slug\":\"review\"},{\"stem\":\"lab-06-cu
