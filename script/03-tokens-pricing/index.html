n\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n8:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Ld\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n9:[\"$\",\"$1\",\"c\",{\"children\":[\"$Le\",null,[\"$\",\"$Lf\",null,{\"children\":[\"$L10\",[\"$\",\"$L11\",null,{\"promise\":\"$@12\"}]]}]]}]\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],null],[\"$\",\"$L15\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$3\",null,{\"fallback\":null,\"children\":\"$L16\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"17:I[7862,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"383\",\"static/chunks/383-e517ce984f475807.js\",\"436\",\"static/chunks/app/script/%5Bslug%5D/page-66d8edf99d546b09.js\"],\"MarkdownBody\"]\n18:T1c53,"])</script><script>self.__next_f.push([1,"# สคริปต์วิดีโอ: โทเคนและราคา\n\n- บท: `core-03`\n- ภาษาพูด: ไทย\n- ภาพหน้าจอ: UI อังกฤษของเครื่องมือจริง\n- ความยาวเป้า: 8–10 นาที\n- แทร็กเดโมเริ่มต้น: Cursor\n\n## ภาพรวมตอน\n\nผู้เรียนเห็นว่าบิลไม่ได้มาจากประโยคคำถามสั้นๆ อย่างเดียว แต่มาจากไฟล์ที่แนบ ประวัติแชท และความยาวของคำตอบ\n\n## อุปกรณ์หน้าจอ\n\n- หน้า usage หรือตัวนับโทเคน ถ้ามี\n- แชทสั้นหนึ่งเธรด และแชทที่แนบไฟล์ยาวหนึ่งเธรด\n\n---\n\n## 0:00–0:35 เปิดตอน\n\n**ภาพ:** หน้า usage หรือแถบที่บอกปริมาณการใช้\n\n**พูด:**\n\nตอนที่สาม โทเคนและราคา เป้าหมายคืออ่านบิลจากขนาดคอนเท็กซ์ได้ ไม่ต้องรอใบแจ้งหนี้สิ้นเดือนแล้วค่อยงง\n\n---\n\n## 0:35–3:10 แนวคิดแกน\n\n**ภาพ:** สามคำบนจอ `อินพุต` `เอาต์พุต` `การวนซ้ำ`\n\n**พูด:**\n\nโทเคนคือหน่วยนับข้อความของโมเดล ภาษาไทย โค้ด และเครื่องหมาย มักถูกหั่นละเอียดกว่าที่ตาเห็น อย่านับคำไทยแล้วคิดว่าเท่ากับจำนวนโทเคน\n\nคิดถึงค่าส่งอาหาร ไม่ได้คิดแค่จานหลัก น้ำหนักถุง ระยะทาง และเวลาที่ร้านล้วนคิดเงิน แชทก็เหมือนกัน ราคาไม่ได้อยู่ที่ประโยคถามสั้นๆ แต่มาจากทุกอย่างที่ถูกส่งไปกับคำถาม\n\nต้นทุนมีสามก้อน ก้อนแรกอินพุต คือพรอมต์ ไฟล์ ประวัติแชท และผลจากเครื่องมือ ก้อนที่สองเอาต์พุต คือคำอธิบายยาว แผนยาว โค้ดทั้งไฟล์ ก้อนที่สามการวนซ้ำ เอเจนต์ที่อ่าน แก้ แล้วอ่านอีก เก็บโทเคนทุกรอบ\n\nงานถูกจึงไม่ใช่งานที่พิมพ์สั้นที่สุด แต่งานที่ส่งเฉพาะของที่ต้องใช้ แล้วขอเอาต์พุตในรูปที่ตรวจได้ เช่น สามข้อสรุป ไม่ใช่ทั้งรายงาน\n\nมองเป็นกระจก สติก็มีขีดเหมือนโทเคน การเรียกเธอซ้ำโดยไม่มีของใหม่คือการวัดซ้ำที่กินพลังงาน ของเก่าที่ไม่มีแก่น ปล่อยได้ นี่คือมหาสูญตาในบิล ไม่ใช่ในห้องแล็บฟิสิกส์\n\n---\n\n## 3:10–6:50 เดโมหน้าจอ\n\n**พูด:**\n\nผมจะถามคำถามเดียวกันสองแบบ แบบแรกสั้น แบบที่สองแนบของเกิน\n\n```text\nสรุปกฎคิดส่วนลดในสามข้อ\nแล้วบอกว่าเทสไหนขาดอยู่หนึ่งเคส\nอย่าเขียนโค้ดใหม่ทั้งไฟล์\n```\n\n**ภาพ:** ส่งในเธรดที่อ้างไฟล์เดียว ชี้ usage ถ้ามีตัวเลข\n\n**พูด:**\n\nนี่คือต้นทุนฐานของคำถามนี้ จากนั้นเปิดเธรดใหม่ วางไฟล์ที่ไม่เกี่ยวหรือล็อกยาว แล้วส่งข้อความเดิม\n\nถ้าตัวเลขอินพุตกระโดดแต่คำตอบไม่ได้เพิ่มเคสเทสที่มีประโยชน์ แปลว่าเราจ่ายค่าขนของ ไม่ได้จ่ายค่าคิด\n\nอีกเรื่องที่คนพลาดคือคุยในเธรดเดิมทั้งวัน ของเก่าไม่ออกไปไหน มันยังกินที่และกินเงิน งานคนละเรื่องให้เริ่มเธรดใหม่\n\nถ้าเครื่องมือของคุณไม่โชว์ตัวเลข ให้ประมาณจากจำนวนไฟล์และความยาวคำตอบ ทิศทางของบิลยังอ่านได้แม้ไม่มีเลขเป๊ะ\n\n---\n\n## 6:50–7:50 กับดัก\n\n**พูด:**\n\nอย่าวางล็อกทั้งก้อนทั้งที่ต้องการฟังก์ชันเดียว อย่าขอให้อธิบายให้หมดถ้าไม่มีใครอ่าน อย่าสลับโมเดลแพงตอนทดลองเล็กๆ โดยไม่ดูราคา และอย่าลืมว่าคำตอบยาวที่ดูดี อาจเป็นเอาต์พุตแพงที่ไม่ได้ช่วยตัดสินใจ\n\n---\n\n## 7:50–9:20 ปิดท้ายและแล็บ\n\n**ภาพ:** [labs/03-prompt-size.md](../../labs/03-prompt-size.md) และ [Tokens and pricing](https://cursor.com/learn/tokens-pricing)\n\n**พูด:**\n\nแล็บให้คุณเติมตารางเทียบแชทสั้นกับแชทยาว แล้วเลือกแบบที่จะใช้ในงานจริงพร้อมเหตุผล\n\nอ่านต้นฉบับได้ที่ Cursor Learn บท Tokens and pricing ตอนต่อไปเราจะคุยเรื่องคอนเท็กซ์ คือทุกอย่างที่โมเดลเห็นตอนตอบ ไม่ใช่แค่ประโยคที่พิมพ์ ไว้เจอกันครับ\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"header\",null,{\"className\":\"lesson-head\",\"children\":[[\"$\",\"p\",null,{\"className\":\"kicker\",\"children\":\"สคริปต์วิดีโอ\"}],[\"$\",\"h1\",null,{\"children\":\"สคริปต์วิดีโอ: โทเคนและราคา\"}]]}],[\"$\",\"$L17\",null,{\"markdown\":\"$18\",\"stems\":[{\"stem\":\"00-mirror\",\"slug\":\"mirror\"},{\"stem\":\"01-how-models-work\",\"slug\":\"how-models-work\"},{\"stem\":\"02-hallucinations\",\"slug\":\"hallucinations\"},{\"stem\":\"03-tokens-pricing\",\"slug\":\"tokens-pricing\"},{\"stem\":\"04-context\",\"slug\":\"context\"},{\"stem\":\"05-tool-calling\",\"slug\":\"tool-calling\"},{\"stem\":\"06-agents\",\"slug\":\"agents\"},{\"stem\":\"lab-01-working-with-agents\",\"slug\":\"working-with-agents\"},{\"stem\":\"lab-02-understand-codebase\",\"slug\":\"understand-codebase\"},{\"stem\":\"lab-03-create-features\",\"slug\":\"create-features\"},{\"stem\":\"lab-04-debug\",\"slug\":\"debug\"},{\"stem\":\"lab-05-review\",\"slug\":\"review\"},{\"stem\":\"lab-06-customize\",\"slug\":\"customize\"},{\"stem\":\"lab-07-capstone\",\"slug\":\"capstone\"}]}]]\n"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:null\n"])</script><script>self.__next_f.push([1,"12:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"AI-Acadamy\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"เรียนเอเจนต์เป็นไทย แล้วเห็นตนเองผ่านกระจกมหาสูญตา\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://nirvacore.github.io/AI-Acadamy/\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"16:\"$12:metadata\"\n"])</script></body></html>
