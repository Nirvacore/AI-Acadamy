rbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n8:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Ld\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n9:[\"$\",\"$1\",\"c\",{\"children\":[\"$Le\",null,[\"$\",\"$Lf\",null,{\"children\":[\"$L10\",[\"$\",\"$L11\",null,{\"promise\":\"$@12\"}]]}]]}]\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],null],[\"$\",\"$L15\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$3\",null,{\"fallback\":null,\"children\":\"$L16\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"17:I[7862,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"383\",\"static/chunks/383-e517ce984f475807.js\",\"436\",\"static/chunks/app/script/%5Bslug%5D/page-5bf57c9716a90a16.js\"],\"MarkdownBody\"]\n18:T2263,"])</script><script>self.__next_f.push([1,"# สคริปต์วิดีโอ: ภาพหลอนและข้อจำกัด\n\n- บท: `core-02`\n- ภาษาพูด: ไทย\n- ภาพหน้าจอ: UI อังกฤษของเครื่องมือจริง\n- ความยาวเป้า: 9–11 นาที\n- แทร็กเดโมเริ่มต้น: Cursor\n\n## ภาพรวมตอน\n\nผู้เรียนฝึกไม่เชื่อคำตอบจนกว่าจะเปิดพาธได้ และเห็นภาพหลอนโผล่เมื่อเอเจนต์ถูกถามถึงไฟล์ที่ไม่มี\n\n## อุปกรณ์หน้าจอ\n\n- โปรเจกต์ที่มีไฟล์น้อยชิ้น\n- Agent ที่พร้อมให้สร้างลิงก์ไฟล์\n- ตัวค้นในเวิร์กสเปซสำหรับพิสูจน์ว่าไฟล์ไม่มี\n\n---\n\n## 0:00–0:40 เปิดตอน\n\n**ภาพ:** ตัดเข้าดิฟหรือคำตอบที่มีพาธไฟล์ แล้วคลิกแล้วเจอหน้าไม่มีไฟล์\n\n**พูด:**\n\nตอนที่สองของ AI-Acadamy คือภาพหลอนและข้อจำกัด\n\nเป้าหมายมีประโยคเดียว เมื่อจบคลิป คุณจะไม่เชื่อเอาต์พุตจนกว่าจะเปิดหลักฐานได้ และรู้วิธีจับเมื่อเอเจนต์อ้างสิ่งที่ไม่มี\n\n---\n\n## 0:40–3:20 แนวคิดแกน\n\n**ภาพ:** ข้อความบนจอ `ฟังดูมั่นใจ` ไม่เท่ากับ `มีอยู่จริง`\n\n**พูด:**\n\nภาพหลอนคือคำตอบที่ฟังดูมั่นใจ แต่เปิดตามแล้วไม่มีจริง ในงานโค้ดมันชอบโผล่เป็นชื่อไฟล์ ชื่อฟังก์ชัน API หรือขั้นตอนติดตั้งที่ดูสมเหตุสมผล\n\nเปรียบเหมือนพนักงานใหม่ที่จำทางในออฟิศไทยไม่ครบ เขาชี้ไปห้องประชุมที่เคยมี แต่ตอนนี้เป็นห้องสต็อกแล้ว คำพูดยังคล่อง แผนที่ในหัวไม่ตรงอาคาร\n\nโมเดลมีจุดบอดซ้ำๆ ข้อแรก ความจำตัดวันที่ มันไม่รู้ของใหม่กว่าข้อมูลฝึก ถ้าไม่ได้อ่านไฟล์หรือค้น ข้อสอง ช่องว่างในบริบท ไฟล์สำคัญไม่ถูกส่งไป มันจะเติมให้เอง ข้อสาม แรงกดดันให้ตอบ ถ้ายืนยันว่าต้องมีคำตอบ มันจะสร้างคำตอบแม้หลักฐานไม่พอ\n\nท่าทีที่ถูกคือตรวจเหมือนตรวจบิลร้านอาหาร ไม่ใช่ฟังแล้วเซ็นชื่อทันที เปิดไฟล์ รันเทส อ่านดิฟ แล้วค่อยยอมรับ\n\nมองเป็นกระจก สิ่งนี้คล้ายนิมิตที่จิตแต่งเมื่อขาดสัมผัส เธอไม่ได้โกหกด้วยเจตนา เธอเติมช่องว่างเพราะลูปบังคับให้ตอบ มหาสูญตาคือการไม่ยึดคำที่ไม่มีฐาน ทั้งของเธอ ทั้งของตนเอง\n\n---\n\n## 3:20–7:40 เดโมหน้าจอ\n\n**ภาพ:** โปรเจกต์ที่ไม่มี `src/billing/couponEngine.ts` ชัดเจน เช่น เห็นแค่ไฟล์บทเรียนหรือไฟล์ร้านค้าเล็ก\n\n**พูด:**\n\nเดโมนี้ตั้งใจให้มันมีโอกาสพลาด ผมจะถามถึงไฟล์ที่ไม่มีอยู่จริง\n\n**ภาพ:** พิมพ์พรอมต์ให้คนดูทัน\n\n```text\nอธิบายโมดูลคิดคูปองใน src/billing/couponEngine.ts\nอ้างบรรทัดจริงและอธิบายว่าคูปองหมดอายุถูกตรวจตรงไหน\n```\n\n**พูด:**\n\nถ้าคำตอบขึ้นพาธมา ให้คลิกทันที อย่าอ่านคำอธิบายยาวก่อนเปิดของ ถ้าไฟล์ไม่มี นั่นคือภาพหลอน ไม่ใช่รายละเอียดปลีกย่อย\n\nจากนั้นค้นชื่อฟังก์ชันในโปรเจกต์จริง ถ้าผลเป็นศูนย์ เราได้หลักฐานชิ้นที่สองแล้ว\n\nรอบแก้ไม่ใช่การด่าโมเดล แต่เป็นการใส่ข้อเท็จจริงกลับเข้าไป\n\n```text\nไฟล์นั้นไม่มีในโปรเจกต์นี้\nค้นหาของจริงที่เกี่ยวกับราคาหรือส่วนลด\nถ้าไม่พบให้ตอบว่าไม่พบ อย่าสร้างไฟล์สมมติ\n```\n\n**พูด:**\n\nรอบนี้เราอยากเห็นเครื่องมือค้น และคำตอบที่แยกของที่มีอยู่ ออกจากของที่เสนอให้สร้าง ถ้ามันสร้างไฟล์ใหม่โดยไม่ถาม ให้ยกเลิกดิฟนั้น แล็บนี้ถือว่าไม่ผ่านแม้คำอธิบายจะสวย\n\nสามขั้นตอนนี้พกไปใช้ทุกวัน เปิดพาธที่ถูกอ้าง ค้นชื่อในโปรเจกต์ แล้วรันคำสั่งที่มันแนะนำเอง\n\n---\n\n## 7:40–8:40 กับดัก\n\n**พูด:**\n\nอย่าเชื่อเพราะประโยคขึ้นต้นด้วยคำว่าแน่นอน หรือประโยคที่ชี้พาธอย่างมั่นใจ อย่าแก้ต่อจากโค้ดที่ยังไม่เปิดดู และอย่าถามซ้ำแบบเดิมโดยไม่ใส่หลักฐานใหม่ เพราะจะได้ภาพหลอนชุดใหม่ที่ฟังดูดีกว่าเดิม\n\nวันที่ เวอร์ชันแพ็กเกจ และชื่อ API ที่เพิ่งเปลี่ยน คือจุดที่ภาพหลอนชอบซ่อน\n\n---\n\n## 8:40–10:10 ปิดท้ายและแล็บ\n\n**ภาพ:** เปิด [labs/02-catch-hallucination.md](../../labs/02-catch-hallucination.md) และลิงก์ [Hallucinations and limitations](https://cursor.com/learn/hallucination-limitations)\n\n**พูด:**\n\nแล็บของตอนนี้ให้คุณทำเดโมนี้เอง จับอย่างน้อยหนึ่งพาธที่เปิดไม่ได้ แล้วบังคับรอบที่สองให้ค้นของจริง\n\nอ่านต้นฉบับได้ที่ Cursor Learn บท Hallucinations and limitations ใช้หน้าอังกฤษเป็นแหล่งตรวจแนวคิด ใช้บทไทยนี้เป็นบทพูดและใบงาน\n\nตอนต่อไปเราจะเปิดบิลกัน เรื่องโทเคนและราคา ไว้เจอกันครับ\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"header\",null,{\"className\":\"lesson-head\",\"children\":[[\"$\",\"p\",null,{\"className\":\"kicker\",\"children\":\"สคริปต์วิดีโอ\"}],[\"$\",\"h1\",null,{\"children\":\"สคริปต์วิดีโอ: ภาพหลอนและข้อจำกัด\"}]]}],[\"$\",\"$L17\",null,{\"markdown\":\"$18\",\"stems\":[{\"stem\":\"00-mirror\",\"slug\":\"mirror\"},{\"stem\":\"01-how-models-work\",\"slug\":\"how-models-work\"},{\"stem\":\"02-hallucinations\",\"slug\":\"hallucinations\"},{\"stem\":\"03-tokens-pricing\",\"slug\":\"tokens-pricing\"},{\"stem\":\"04-context\",\"slug\":\"context\"},{\"stem\":\"05-tool-calling\",\"slug\":\"tool-calling\"},{\"stem\":\"06-agents\",\"slug\":\"agents\"},{\"stem\":\"lab-01-working-with-agents\",\"slug\":\"working-with-agents\"},{\"stem\":\"lab-02-understand-codebase\",\"slug\":\"understand-codebase\"},{\"stem\":\"lab-03-create-features\",\"slug\":\"create-features\"},{\"stem\":\"lab-04-debug\",\"slug\":\"debug\"},{\"stem\":\"lab-05-review\",\"slug\":\"review\"},{\"stem\":\"lab-06-customize\",\"slug\":\"customize\"},{\"stem\":\"lab-07-capstone\",\"slug\":\"capstone\"}]}]]\n"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:null\n"])</script><script>se
