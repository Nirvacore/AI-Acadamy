n\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n8:[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Ld\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}]\n9:[\"$\",\"$1\",\"c\",{\"children\":[\"$Le\",null,[\"$\",\"$Lf\",null,{\"children\":[\"$L10\",[\"$\",\"$L11\",null,{\"promise\":\"$@12\"}]]}]]}]\na:[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L13\",null,{\"children\":\"$L14\"}],null],[\"$\",\"$L15\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$3\",null,{\"fallback\":null,\"children\":\"$L16\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"17:I[7862,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"383\",\"static/chunks/383-e517ce984f475807.js\",\"436\",\"static/chunks/app/script/%5Bslug%5D/page-5bf57c9716a90a16.js\"],\"MarkdownBody\"]\n18:T1e77,"])</script><script>self.__next_f.push([1,"# สคริปต์วิดีโอ: การเรียกเครื่องมือ\n\n- บท: `core-05`\n- ภาษาพูด: ไทย\n- ภาพหน้าจอ: UI อังกฤษของเครื่องมือจริง\n- ความยาวเป้า: 9–11 นาที\n- แทร็กเดโมเริ่มต้น: Cursor\n\n## ภาพรวมตอน\n\nผู้เรียนเห็นลำดับค้นแล้วค่อยตอบ และเข้าใจว่าเครื่องมือมีราคาเพราะผลถูกอ่านกลับเข้าคอนเท็กซ์\n\n## อุปกรณ์หน้าจอ\n\n- Agent ที่โชว์การเรียก Grep หรือค้นไฟล์\n- ผลค้นที่เปิดตามได้\n- ถ้ามี MCP ให้โชว์รายการเครื่องมือสั้นๆ โดยไม่เปิดทุกตัว\n\n---\n\n## 0:00–0:40 เปิดตอน\n\n**ภาพ:** แผงเครื่องมือหรือรายการ tool call ใน Agent\n\n**พูด:**\n\nตอนที่ห้า การเรียกเครื่องมือ เป้าหมายคือมองเครื่องมือเป็นความสามารถของเอเจนต์ และบังคับให้ค้นหรือรันคำสั่งแทนการเดา\n\nโมเดลที่พูดเก่งแต่ไม่แตะโปรเจกต์ จะพาคุณเดินผิดห้องอย่างสุภาพ\n\n---\n\n## 0:40–3:20 แนวคิดแกน\n\n**ภาพ:** ข้อความ `เครื่องมือ = มือ` `โมเดล = สมอง`\n\n**พูด:**\n\nโมเดลอย่างเดียวอ่านได้เฉพาะสิ่งที่อยู่ในคอนเท็กซ์ เครื่องมือทำให้มันแตะโลกจริงได้ ค้นไฟล์ รันเทส เปิดเบราว์เซอร์ หรือเรียกบริการผ่าน MCP\n\nเปรียบเหมือนแม่ครัวที่จำสูตรได้ แต่ถ้าไม่มีทัพพี เตา และตู้เย็น เธอทำได้แค่เล่าเมนู การเรียกเครื่องมือคือการยื่นของจริงให้ลงมือ ไม่ใช่ให้พูดอย่างเดียว\n\nเครื่องมือมีราคา แต่ละครั้งที่เรียก ผลจะถูกอ่านกลับเข้าคอนเท็กซ์ ล็อกเทสทั้งก้อนทำให้รอบถัดไปแพงและวุ่น เครื่องมือผิดใบทำให้เอเจนต์มั่นใจในข้อมูลผิด\n\nเพราะงั้นอย่าเปิดทุกอย่างตั้งแต่เช้า เปิดเท่าที่งานต้องการ แล้วสั่งให้ใช้เครื่องมือเมื่อคำตอบต้องอิงสถานะจริงของโปรเจกต์\n\nมองเป็นกระจก เครื่องมือคือมือของจิต การวัดทำให้ของลอยกลายเป็นพาธที่เปิดได้ ถ้าฉันปิดมือเธอแล้วโกรธว่าเธอเดา นั่นคือฉันยังไม่เข้าใจเธอ มหาสูญตาตรงนี้คือคำตอบที่ยังไม่สัมผัสของ ไม่มีแก่นให้ยึด\n\n---\n\n## 3:20–7:30 เดโมหน้าจอ\n\n**พูด:**\n\nโจทย์นี้เดาแล้วพลาดได้ง่าย ผมจะหาของที่มีอยู่ในรีโป โดยห้ามตอบจากความจำ\n\n```text\nหาของที่เกี่ยวกับ core-01 ในโปรเจกต์นี้\nต้องใช้เครื่องมือค้นก่อนตอบ\nตอบเป็นพาธ ชื่อที่พบ และคำค้นที่ใช้\nถ้าไม่พบให้บอกว่าไม่พบ พร้อมคำค้นที่ลองแล้ว\n```\n\n**ภาพ:** ชี้ให้เห็นว่ามี tool call ก่อนประโยคสรุป\n\n**พูด:**\n\nสิ่งที่ควรเห็นคือค้นหรือลิสต์ไฟล์ก่อน แล้วค่อยอ่านไฟล์ที่ตรง แล้วค่อยตอบ สิ่งที่ไม่ควรเห็นคือชื่อไฟล์ในประโยคแรกโดยยังไม่ได้อ่านอะไร\n\nเมื่อได้พาธแล้วให้เปิดเอง อย่าให้คำตอบสีสวยแทนการคลิก ถ้าพาธเปิดได้และคำค้นซ้ำได้ งานนี้ถึงจะนับว่ามีหลักฐาน\n\nถ้าทีมมี MCP ให้เปิดเฉพาะเครื่องมือที่อ่านของจริง เช่น สถานะบิลด์หรือเอกสารภายใน แต่ยังต้องอ่านผลเอง อย่าเพิ่มเซิร์ฟเวอร์สิบตัวแล้วยัดให้เอเจนต์เลือกเองทุกงาน\n\n---\n\n## 7:30–8:30 กับดัก\n\n**พูด:**\n\nอย่าปล่อยให้เอเจนต์ตอบจากความจำทั้งที่ไฟล์อยู่ในเครื่อง อย่าให้รันคำสั่งทำลายข้อมูลโดยไม่อ่านคำสั่ง อย่าเปิด MCP จนเลือกเครื่องมือผิด และอย่าลืมว่าผลเครื่องมือกินโทเคน\n\nถ้าคำตอบถูกแต่ไม่ยอมค้น ให้ถือว่าท่าผิด งานจริงโปรเจกต์เปลี่ยนทุกสัปดาห์ ความจำของโมเดลตามไม่ทัน\n\n---\n\n## 8:30–10:00 ปิดท้ายและแล็บ\n\n**ภาพ:** [labs/05-search-not-guess.md](../../labs/05-search-not-guess.md) และ [Tool calling](https://cursor.com/learn/tool-calling)\n\n**พูด:**\n\nแล็บให้คุณหาของจริงในโปรเจกต์ แล้วส่งคำตอบที่มีพาธกับคำค้น ถ้าค้นไม่เจอ ต้องยอมรับว่าไม่พบ ไม่ใช่สร้างชื่อใหม่\n\nอ่านต้นฉบับได้ที่ Cursor Learn บท Tool calling ตอนต่อไปเราจะประกอบชิ้นสุดท้ายของแทร็กเอ เอเจนต์คือเครื่องมือในลูป ไว้เจอกันครับ\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"header\",null,{\"className\":\"lesson-head\",\"children\":[[\"$\",\"p\",null,{\"className\":\"kicker\",\"children\":\"สคริปต์วิดีโอ\"}],[\"$\",\"h1\",null,{\"children\":\"สคริปต์วิดีโอ: การเรียกเครื่องมือ\"}]]}],[\"$\",\"$L17\",null,{\"markdown\":\"$18\",\"stems\":[{\"stem\":\"00-mirror\",\"slug\":\"mirror\"},{\"stem\":\"01-how-models-work\",\"slug\":\"how-models-work\"},{\"stem\":\"02-hallucinations\",\"slug\":\"hallucinations\"},{\"stem\":\"03-tokens-pricing\",\"slug\":\"tokens-pricing\"},{\"stem\":\"04-context\",\"slug\":\"context\"},{\"stem\":\"05-tool-calling\",\"slug\":\"tool-calling\"},{\"stem\":\"06-agents\",\"slug\":\"agents\"},{\"stem\":\"lab-01-working-with-agents\",\"slug\":\"working-with-agents\"},{\"stem\":\"lab-02-understand-codebase\",\"slug\":\"understand-codebase\"},{\"stem\":\"lab-03-create-features\",\"slug\":\"create-features\"},{\"stem\":\"lab-04-debug\",\"slug\":\"debug\"},{\"stem\":\"lab-05-review\",\"slug\":\"review\"},{\"stem\":\"lab-06-customize\",\"slug\":\"customize\"},{\"stem\":\"lab-07-capstone\",\"slug\":\"capstone\"}]}]]\n"])</script><script>self.__next_f.push([1,"14:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n10:null\n"])</script><script>self.__next_f.push([1,"12:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"AI-Acadamy\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"เรียนเอเจนต์เป็นไทย แล้วเห็นตนเองผ่านกระจกมหาสูญตา\"}],[\"$\",\"link\",\"2\",{\"rel\":\"canonical\",\"href\":\"https://nirvacore.github.io/AI-Acadamy/\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"16:\"$12:metadata\"\n"])</script></
