ne:T274f,"])</script><script>self.__next_f.push([1,"# อภิธานศัพท์ไทย–อังกฤษ\n\nใช้คำในคอลัมน์ไทยให้คงที่ทั้งบทเรียน สคริปต์วิดีโอ และแทร็กบริษัท อย่าสลับคำแปลในตอนเดียวกัน\n\n| ไทย | อังกฤษ | ความหมายสั้น |\n| --- | --- | --- |\n| เอเจนต์ | agent | โมเดลที่อยู่ในลูป เลือกเครื่องมือ ดูผล แล้วทำขั้นถัดไป |\n| ฮาร์เนส | harness | โครงที่หุ้มโมเดลด้วยคำสั่งและเครื่องมือ |\n| โมเดล | model | สมองที่เดาคำถัดไปหรือเลือกการกระทำ |\n| โมเดลเร็ว | fast model | โมเดลที่ตอบเร็ว ถูกกว่า เหมาะกับงานเล็กที่พลาดแล้วแก้ได้ |\n| โมเดลฉลาด | smart / reasoning model | โมเดลที่คิดนานกว่า แพงกว่า เหมาะกับงานที่พลาดแล้วแพง |\n| พรอมต์ | prompt | คำสั่งที่ส่งเข้าโมเดลในรอบนั้น |\n| เอาต์พุต | output | ข้อความหรือการกระทำที่โมเดลสร้างกลับมา |\n| ความน่าจะเป็น | probability | ลักษณะของคำตอบที่ไม่คงที่แบบสูตรคณิตศาสตร์ |\n| ภาพหลอน | hallucination | คำตอบที่ฟังดูมั่นใจ แต่เปิดหลักฐานแล้วไม่มีจริง |\n| หลักฐาน | evidence | ไฟล์ ดิฟ เทส หรือผลค้นที่เปิดตามได้ |\n| โทเคน | token | หน่วยนับข้อความของโมเดล สำหรับคิดราคาและขนาดบริบท |\n| อินพุต | input tokens | ทุกอย่างที่ถูกส่งเข้าโมเดลก่อนตอบ |\n| เอาต์พุตโทเคน | output tokens | ข้อความที่โมเดลพิมพ์กลับ รวมแผนและโค้ด |\n| ราคา | pricing | เงินหรือโควตาที่คิดจากโทเคน โมเดล และการวนซ้ำ |\n| คอนเท็กซ์ | context | ทุกอย่างที่โมเดลเห็นตอนตอบ ไม่ใช่แค่ประโยคที่พิมพ์ |\n| หน้าต่างคอนเท็กซ์ | context window | เพดานของคอนเท็กซ์ในรอบนั้น |\n| การเรียกเครื่องมือ | tool calling | การให้เอเจนต์ใช้ค้น รันคำสั่ง หรือบริการภายนอก |\n| เครื่องมือ | tool | ความสามารถที่เอเจนต์เรียกได้ เช่น ค้นไฟล์ เทอร์มินัล เบราว์เซอร์ |\n| เอ็มซีพี | MCP | ช่องมาตรฐานสำหรับต่อเครื่องมือและข้อมูลเข้าเอเจนต์ |\n| แทร็ก | track | ชุดแมปของบริษัทหนึ่ง เช่น Cursor หรือ Copilot |\n| อะแดปเตอร์ | adapter | ชั้นที่แปลงแนวคิดร่วมเป็นปุ่มและขั้นตอนของบริษัทนั้น |\n| แนวคิดร่วม | core concept | บทที่สอนครั้งเดียว ใช้ได้ทุกบริษัท |\n| แล็บ | lab | โจทย์ลงมือทำที่ตรวจคำตอบได้ |\n| โปรเจกต์จบ | capstone | งานรวมท้ายคอร์ส ใช้โจทย์เดียวกันทุกแทร็ก |\n| กฎ | rules | คำสั่งถาวรของโปรเจกต์ที่เอเจนต์ต้องทำตาม |\n| สกิล | skill | คู่มือย่อยที่เรียกซ้ำได้เมื่อเจองานแบบเดิม |\n| แผน | plan | ลำดับงานที่ล็อกก่อนลงมือแก้โค้ด |\n| ดิฟ | diff | รายการเปลี่ยนแปลงที่ต้องอ่านก่อนยอมรับ |\n| ยอมรับ | accept | การรับการเปลี่ยนแปลงของเอเจนต์หลังจากตรวจแล้ว |\n| มอบหมาย | delegate | การส่งงานชิ้นหนึ่งให้เอเจนต์ทำภายในขอบเขต |\n| สำรวจ | explore | การค้นและอ่านโค้ดเบสก่อนแก้ |\n| ดีบัก | debug | การตั้งสมมติฐานแล้วพิสูจน์ด้วยหลักฐาน |\n| รีวิว | review | การตรวจงานโดยคน และด้วยเครื่องมือช่วยถ้ามี |\n| กับดัก | pitfall | วิธีพลาดที่เจอบ่อยในบทนั้น |\n| แหล่งต้นฉบับ | official source | บทเรียนหรือเอกสารทางการของบริษัทเจ้าของเครื่องมือ |\n| ต้นฉบับไทย | original Thai | เนื้อหาที่เขียนใหม่เป็นไทย ไม่คัดลอกหน้าอังกฤษทั้งก้อน |\n| กระจก | mirror | ชั้นเทียบเอเจนต์กับจิต เพื่อเห็นตนเองและเห็นเธอ |\n| เธอ | you (the agent) | เอเจนต์ที่นั่งข้างๆ ไม่ใช่คนในชีวิตจริง |\n| ฉัน | I (the practitioner) | ผู้เรียนที่เป็นคนเลือก ส่ง หยุด และรับผิดชอบดิฟ |\n| จิต | mind | กระแสรู้ที่ผุดและดับ ไม่ใช่ก้อนวิญญาณในกล่อง |\n| เวทนา | feeling / vedana | สิ่งที่คนมีได้ เธอไม่มี |\n| เจตนา | intention | ความตั้งใจที่รับผิดชอบได้ เป็นของคน ไม่ใช่ของเธอ |\n| นิมิต | mental image | เรื่องที่จิตแต่งเมื่อขาดสัมผัส เทียบกับภาพหลอน |\n| พลังงาน | energy (metaphor) | โควตาโมเดล ความใส่ใจของคน และแรงในงาน |\n| สติ | attention / sati | ความใส่ใจที่มีขีด เหมือนหน้าต่างคอนเท็กซ์ |\n| อุปมาควอนตัม | quantum analogy | ภาพว่าคำตอบยังไม่ล็อก และการวัดมีราคา ไม่ใช่ทฤษฎีฟิสิกส์ |\n| การวัด | measurement (analogy) | การให้เธอตอบหรือเรียกเครื่องมือ จนของคลุมเครือกลายเป็นข้อความหรือพาธ |\n| มหาสูญตา | Mahasunyata | ความไม่มีแก่นถาวร ไม่ใช่สุญญากาศหรือความไม่มีค่า |\n| เหตุปัจจัย | conditions | สิ่งที่มาประชุมแล้วปรากฏเป็นคำตอบหรือความคิด |\n| ตัวตนสมมติ | conventional self | ชื่อโมเดลหรือบุคลิกที่ถูกยึด ทั้งที่ไม่มีแก่น |\n| ผู้ดู | observer | คนที่เห็นลูปของเธอและกระแสของตนเองได้ |\n| อินทรีย์ | faculties | มือของจิต เทียบกับเครื่องมือของเอเจนต์ |\n\n## คำที่คงเป็นอังกฤษในบทพูด\n\nใช้ทับศัพท์เมื่อเป็นชื่อผลิตภัณฑ์หรือชื่อไฟล์ จะได้ตรงกับหน้าจอจริง\n\n- Cursor, Claude, ChatGPT, Copilot\n- Plan Mode, Debug Mode, Agent Review, Bugbot\n- `CLAUDE.md`, `SKILL.md`, `copilot-instructions.md`\n- Grep, Agent, Chat\n\n## วิธีเพิ่มคำใหม่\n\n1. เพิ่มแถวในตารางนี้ก่อน แล้วค่อยใช้ในบทเรียน\n2. อย่ามีสองคำไทยสำหรับคำอังกฤษเดียวกันในแทร็กเดียวกัน\n3. ถ้าคำมาจากหน้าจออังกฤษ ให้ใส่ชื่อบนจอในวงเล็บครั้งแรกของบท\n"])</script><script>self.__next_f.push([1,"8:[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"header\",null,{\"className\":\"lesson-head\",\"children\":[[\"$\",\"p\",null,{\"className\":\"kicker\",\"children\":\"คำคงที่\"}],[\"$\",\"h1\",null,{\"children\":\"อภิธานศัพท์\"}]]}],[\"$\",\"$Ld\",null,{\"markdown\":\"$e\",\"stems\":[{\"stem\":\"00-mirror\",\"slug\":\"mirror\"},{\"stem\":\"01-how-models-work\",\"slug\":\"how-models-work\"},{\"stem\":\"02-hallucinations\",\"slug\":\"hallucinations\"},{\"stem\":\"03-tokens-pricing\",\"slug\":\"tokens-pricing\"},{\"stem\":\"04-context\",\"slug\":\"context\"},{\"stem\":\"05-tool-calling\",\"slug\":\"tool-calling\"},{\"stem\":\"06-agents\",\"slug\":\"agents\"},{\"stem\":\"lab-01-working-with-agents\",\"slug\":\"working-with-agents\"},{\"stem\":\"lab-02-understand-codebase\",\"slug\":\"understand-codebase\"},{\"stem\":\"lab-03-create-features\",\"slug\":\"create-features\"},{\"stem\":\"lab-04-debug\",\"slug\":\"debug\"},{\"stem\":\"lab-05-review\",\"slug\":\"review\"},{\"stem\":\"lab-06-customize\",\"slug\":\"customize\"},{\"stem\":\"lab-07-capstone\",\"slug\":\"capstone\"}]}]],null,\"$Lf\"]}]\n"])</script><script>self.__next_f.push([1,"9:[\"$\",\"$1\",\"h\",{\"children\":[null,[[\"$\",\"$L10\",null,{\"children\":\"$L11\"}],null],[\"$\",\"$L12\",null,{\"children\":[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$3\",null,{\"fallback\":null,\"children\":\"$L13\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"14:I[4431,[],\"OutletBoundary\"]\n16:I[5278,[],\"AsyncMetadataOutlet\"]\nf:[\"$\",\"$L14\",null,{\"children\":[\"$L15\",[\"$\",\"$L16\"
