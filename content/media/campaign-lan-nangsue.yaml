# Synthetic campaign for Media Lab. Not a real customer, not BEST, no credentials.
id: lan-nangsue-wat-nuea
kind: synthetic
not_real_data: true
title_th: ลานหนังสือวัดเหนือสังเคราะห์
warning: >
  แคมเปญสมมติสำหรับเดินไพป์ไลน์ทั้งสามตอน ห้ามใช้เป็นข้อมูลลูกค้า ห้ามใส่โทเคน
  และห้ามทึกทักว่ามีเพจหรือบัญชีจริงของวัดนี้

goal: >
  ให้คนในชุมชนสมมติรู้ว่ามีลานอ่านหนังสือเย็นวันศุกร์ โดยไม่สัญญาว่าจะโพสต์ขึ้นแพลตฟอร์มจริง
  จากแล็บนี้

audience: ผู้ปกครองและอาสาสมมติในชุมชนวัดเหนือ อายุประมาณ ๒๕–๔๕ ที่อ่าน LINE เป็นหลัก
brief: >
  ลานหนังสือวัดเหนือสังเคราะห์ชวนครอบครัวมานั่งอ่านด้วยกันเย็นวันศุกร์
  โทนอบอุ่น ไม่ขายคอร์ส ไม่เก็บข้อมูลส่วนตัว ไม่ใส่รหัสผ่านหรือชื่อระบบภายใน
  ช่องทางที่ใช้ฝึกคือ LINE OA, Instagram, YouTube ตามแม่แบบใน NirvaMedia/app/api/campaigns/route.ts

evidence: >
  เปิด NirvaMedia/db/schema.ts ช่อง campaigns.brief และ
  NirvaMedia/upstream/nirva-ai/shared/media.ts บรรทัด STATUS_FLOW แล้วจดว่า brief เป็นของคน

facts:
  - claim: สตูดิโอจริงบังคับมี brief ก่อนสร้างร่างแคมเปญ
    source: NirvaMedia/app/api/campaigns/route.ts ตรวจว่า brief ว่างแล้วตอบ 400
  - claim: การเปลี่ยนสถานะข้ามขั้นถูกปฏิเสธด้วย 409 จาก STATUS_FLOW
    source: NirvaMedia/app/api/posts/[id]/route.ts ใช้ canMoveContentStatus

assumptions:
  - claim: ครอบครัวในชุมชนนี้เปิด LINE ทุกเย็นศุกร์
    why: ไม่มีแบบสำรวจ ใช้เป็นสมมติฐานของแคมเปญสมมติเท่านั้น
  - claim: คลิปหนึ่งนาทีจะทำให้คนเดินทางมาลานอ่าน
    why: ยังไม่มีหลักฐานการวัดผล อย่าเขียนเป็นข้อเท็จจริงในแคปชัน

scripts:
  line: >
    เย็นศุกร์นี้ลานหนังสือวัดเหนือสังเคราะห์เปิดพรมให้นั่งอ่านด้วยกัน
    ไม่เก็บแบบฟอร์ม ไม่ขอรหัส แค่มาเลือกหนังสือแล้วอ่านไปด้วยกันสักชั่วโมง
  instagram: >
    สามภาพ: พรมว่าง ชั้นหนังสือสมมติ โคมไฟลาน
    คำบรรยายสั้น ชวนมาอ่าน ไม่ขายของ ไม่ใส่ลิงก์ลับ
  youtube: >
    เปิดด้วยลานว่าง เล่าว่าทีมสมมติอยากมีที่อ่านที่ไม่เร่ง
    ปิดด้วยเวลาเย็นศุกร์ และข้อความว่านี่คือตัวอย่างเรียน ไม่ใช่ประกาศจริง

storyboard:
  source: academy-worksheet
  note: แบบฝึกของ Academy ไม่ใช่โมดูล runtime ใน NirvaMedia
  beats:
    - beat: เปิด
      visual: ลานว่างมีพรมและโคมไฟ
      audio: เสียงลมสั้น แล้วประโยคชวนนั่ง
      note: ยังไม่โชว์ปุ่มโพสต์
    - beat: ปัญหา
      visual: ปฏิทินครอบครัวที่แน่น
      audio: คำว่ายังไม่มีที่พักสายตา
      note: อย่าโทษผู้ชม
    - beat: ทางออก
      visual: คนนั่งอ่านด้วยกันโดยไม่โชว์หน้าจริง
      audio: ชวนมาเย็นศุกร์
      note: ปิดด้วยว่าเป็นตัวอย่างเรียน

postmortem: >
  คนเขียน brief และแยกสมมติฐานแล้ว เธอช่วยร่างคำ ห้ามกดเผยแพร่
  คิวจำลองต้องได้ blocked_auth เพราะแล็บนี้ไม่มีบัญชี connected
