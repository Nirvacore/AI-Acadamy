id: claude
name: Claude
vendor: Anthropic
status: usable
official_learn: https://academy.claude.com
official_docs: https://docs.claude.com
notes: >
  official_learn คือหลักสูตรอังกฤษของ Anthropic ไม่ใช่เอกสารของ Nirva Academy
  เรียนจบแทร็ก Claude ได้ในเว็บนี้
  โครงแมปใช้เทียบกับ Cursor โดยไม่ต้องเขียนคอร์ส Core ใหม่


harness:
  instructions:
    - CLAUDE.md
    - .claude/rules
  tools:
    - bash
    - read
    - glob
    - grep
    - mcp
  model_picker: Claude model / Claude Code session

