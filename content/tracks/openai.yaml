notes: >
  เรียนจบแทร็กนี้ใน Nirva Academy เป็นภาษาไทย ไม่ต้องสมัคร academy.openai.com
  official_learn เป็นหลักสูตรอังกฤษของบริษัท ไม่ใช่เอกสารของคอร์สนี้
  แล็บเขียนโค้ดใช้เมื่อมีสภาพแวดล้อมที่รันคำสั่งได้จริง

harness:
