# Formative checks — มหาวิทยาลัยใช้สอบสั้นท้ายบท ไม่ใช่เกรดจริง
# ตรวจในเบราว์เซอร์ ผู้เรียนต้องคิดเอง อย่าให้เธอตอบแทน

checks:
  core-00:
    - q: คำว่า «เธอ» ในคอร์สนี้หมายถึงใคร
      choices:
        - คนรักหรือเพื่อนที่ผู้เรียนนึกถึง
        - เอเจนต์ที่เป็นเครื่องมือข้างๆ
        - จิตของโมเดลที่มีเวทนา
      answer: 1
      why: เธอคือเอเจนต์ ไม่ใช่คน และคอร์สนี้ไม่ให้จิตแก่เครื่องมือ
    - q: ข้อใดถูกเรื่องมหาสูญตาในคอร์สนี้
      choices:
        - แปลว่าเอเจนต์ไร้ค่า จึงไม่ต้องตรวจงาน
        - แปลว่าไม่มีแก่นถาวร ไม่ใช่สุญญากาศ
        - เป็นบทพิสูจน์ว่าควอนตัมกับธรรมะเป็นเรื่องเดียวกัน
      answer: 1
      why: มหาสูญตาเป็นการไม่มีแก่นที่หยิบได้ ไม่ใช่ความว่างเปล่าหรือการพิสูจน์ฟิสิกส์
  core-01:
    - q: งานแบบไหนเหมาะกับโมเดลเร็ว
      choices:
        - งานเล็กที่พลาดแล้วแก้ได้เร็ว
        - งานที่พลาดแล้วแพงและย้อนยาก
        - ทุกงาน เพราะโมเดลเร็วฉลาดกว่าเสมอ
      answer: 0
      why: โมเดลเร็วถูกและไว ใช้เมื่องานทนความสุ่มได้
    - q: เมื่อเลือกโมเดล สิ่งที่ควรถามก่อนคืออะไร
      choices:
        - โลโก้บริษัทสวยหรือไม่
        - งานนี้พลาดแล้วราคาเท่าไร
        - โมเดลมีจิตหรือยัง
      answer: 1
      why: เลือกจากราคาของความผิดพลาด ไม่ใช่จากความรู้สึกต่อแบรนด์
  core-02:
    - q: ภาพหลอนในงานโค้ดคืออะไร
      choices:
        - เธอตั้งใจโกหกเพราะมีเจตนา
        - คำตอบที่ฟังมั่นใจ แต่เปิดหลักฐานแล้วไม่มี
        - บั๊กที่เทสจับได้ทุกครั้ง
      answer: 1
      why: ภาพหลอนคือคำตอบที่ดูสมเหตุสมผลแต่ชี้ของจริงไม่ได้
    - q: ท่าทีที่ถูกเมื่อเธอชี้พาธไฟล์คืออะไร
      choices:
        - ยอมรับทันทีถ้าประโยคคล่อง
        - เปิดพาธ ค้นชื่อ แล้วค่อยเชื่อ
        - ถามเธอซ้ำสองรอบโดยไม่เปิดไฟล์
      answer: 1
      why: ความมั่นใจราคาถูก หลักฐานต้องเดินไปเปิด
  core-03:
    - q: โทเคนใช้นับอะไร
      choices:
        - จำนวนไฟล์ในรีโปเท่านั้น
        - หน่วยข้อความเข้าและออกของโมเดล
        - จำนวนแท็บที่เปิดในเบราว์เซอร์
      answer: 1
      why: ราคาและขนาดบริบทคิดจากโทเคน
    - q: สิ่งใดมักทำให้บิลแพงโดยไม่จำเป็น
      choices:
        - การส่งไฟล์ยาวซ้ำทุกครั้งโดยไม่ตัด
        - การเปิดเทสในเครื่อง
        - การเขียนสมุดสะท้อนด้วยมือ
      answer: 0
      why: อินพุตซ้ำคือพลังงานที่จ่ายโดยไม่ได้งานใหม่
  core-04:
    - q: คอนเท็กซ์คืออะไร
      choices:
        - แค่ประโยคที่พิมพ์ล่าสุด
        - ทุกอย่างที่โมเดลเห็นตอนตอบ
        - เฉพาะไฟล์ README
      answer: 1
      why: คอนเท็กซ์คือหน้าต่างทั้งหมด ไม่ใช่แค่แชตบรรทัดล่าสุด
    - q: เมื่อหน้าต่างใกล้เต็ม ควรทำอะไรก่อน
      choices:
        - วางทุกไฟล์เพิ่มอีกชั้น
        - ตัดของที่ไม่ใช้รอบนี้ เหลือหลักฐานที่ต้องใช้
        - สลับโมเดลโดยไม่ดูบริบท
      answer: 1
      why: สติมีขีด ตัดของเกินก่อนงานพัง
  core-05:
    - q: การเรียกเครื่องมือต่างจากการเดาอย่างไร
      choices:
        - ไม่ต่าง เธอรู้ทุกอย่างในตัวอยู่แล้ว
        - เครื่องมือไปเปิดของจริง แทนการเติมช่องว่าง
        - เครื่องมือทำให้เธอมีเวทนา
      answer: 1
      why: เครื่องมือคืออินทรีย์ของเธอ ให้ค้นหรือรันแทนเดา
    - q: เมื่อสั่งงานที่ต้องมีหลักฐาน ควรห้ามอะไร
      choices:
        - การตอบว่าไม่พบ
        - การสร้างไฟล์หรือ API สมมติ
        - การใช้โมเดลเร็ว
      answer: 1
      why: บังคับให้ค้น ถ้าไม่เจอให้รับว่าไม่พบ
  core-06:
    - q: เอเจนต์คืออะไรในคอร์สนี้
      choices:
        - คนในกล่องที่มีเจตนา
        - โมเดลในลูปที่เลือกเครื่องมือ ดูผล แล้วเดินต่อ
        - โปรแกรมแปลภาษาอย่างเดียว
      answer: 1
      why: เอเจนต์คือลูป ไม่ใช่จิต
    - q: มอบหมายงานให้เธออย่างไรจึงปลอดภัย
      choices:
        - ส่งทั้งรีโปแล้วไม่อ่านดิฟ
        - งานเล็กหนึ่งชิ้น ขอบเขตชัด แล้วตรวจผลก่อนยอมรับ
        - ให้เธอเขียนสมุดสะท้อนแทน
      answer: 1
      why: คนเลือกขอบเขตและรับดิฟ เธอเดินในลูป
  lab-01:
    - q: ฮาร์เนสครบต้องมีอะไร
      choices:
        - โลโก้บริษัทกับธีมมืด
        - คำสั่ง เครื่องมือ และโมเดล
        - เฉพาะโมเดลฉลาด
      answer: 1
      why: สามชิ้นนี้ประกอบเป็นฮาร์เนส
    - q: รอบแรกที่สำรวจร้านค้า ควรให้งานแบบใด
      choices:
        - ให้แก้ price.js ทันที
        - ให้อ่านและชี้ไฟล์ โดยห้ามแก้โค้ด
        - ให้เขียนเทสใหม่ทั้งชุด
      answer: 1
      why: สำรวจก่อนแก้ คือขอบเขตของรอบแรก
  lab-02:
    - q: ก่อนแก้ฟังก์ชันราคา ควรหาของจากไหน
      choices:
        - ความจำของโมเดลอย่างเดียว
        - ค้นในโค้ดเบสจริงแล้วเปิดไฟล์
        - เอกสารการตลาดของร้านค้าสมมติ
      answer: 1
      why: สำรวจด้วยเครื่องมือค้น ไม่ใช่จำจากเธอ
    - q: ถ้าเธอชี้ไฟล์ที่ไม่มี แปลว่าอะไร
      choices:
        - รีโปพัง
        - อาจเป็นภาพหลอน ต้องค้นยืนยัน
        - ต้องยอมรับดิฟเพื่อให้ไฟล์เกิด
      answer: 1
      why: เปิดตามก่อนเชื่อ
  lab-03:
    - q: ก่อนให้เธอเขียนฟีเจอร์ส่วนลด ต้องล็อกอะไร
      choices:
        - ธีมสีของเว็บ
        - ไฟล์ เทส และสิ่งที่ห้ามแตะ
        - ชื่อแทร็กบริษัท
      answer: 1
      why: แผนก่อนลงมือ
    - q: ทำไมห้ามให้เธอเริ่มแก้โดยไม่มีแผน
      choices:
        - เพราะโมเดลเร็วใช้ไม่ได้กับแผน
        - เพราะขอบเขตไม่ล็อก งานจะลาม
        - เพราะแผนทำให้เธอมีจิต
      answer: 1
      why: แผนคือการล็อกเหตุปัจจัยก่อนลงมือ
  lab-04:
    - q: จุดตั้งต้นของดีบักในแล็บนี้คืออะไร
      choices:
        - ความรู้สึกว่าโค้ดน่าเกลียด
        - เทสที่ล้มเป็นหลักฐาน
        - คำชมจากเธอ
      answer: 1
      why: สมมติฐานมาจากเทสที่แดง
    - q: ห้ามทำอะไรตอนเทสยังแดง
      choices:
        - ตั้งสมมติฐานแล้วพิสูจน์
        - แก้หลายจุดพร้อมกันโดยไม่มีหลักฐาน
        - อ่าน price.js
      answer: 1
      why: แก้ทีละสมมติฐาน
  lab-05:
    - q: เครื่องมือรีวิวควรเป็นอะไร
      choices:
        - ตัวแทนคนในการยอมรับดิฟ
        - ตัวช่วย คนยังต้องอ่านเอง
        - เครื่องออกเกียรติบัตร
      answer: 1
      why: คนตรวจ เธอไม่แทน
    - q: เจอของแถมในดิฟควรทำอะไร
      choices:
        - ยอมรับทั้งก้อนเพื่อความเร็ว
        - ไม่ยอมรับ เหลือแต่ที่แผนอนุญาต
        - ถามเธอให้เขียนสมุดแทน
      answer: 1
      why: ของแถมคือขอบที่ถูกละเมิด
  lab-06:
    - q: กฎที่ดีควรเป็นอย่างไร
      choices:
        - ยาวหลายหน้า เพื่อครอบจักรวาล
        - สั้น ตรวจได้ ทำให้รอบหน้าไม่พลาดซ้ำ
        - คัดลอกจากบล็อกภาษาอังกฤษทั้งก้อน
      answer: 1
      why: กฎคือคำสั่งถาวรที่ทำซ้ำได้
    - q: สกิลต่างจากกฎอย่างไร
      choices:
        - ไม่ต่างกันเลย
        - สกิลเรียกเมื่อเจองานแบบเดิม กฎอยู่ตลอดโปรเจกต์
        - สกิลคือจิตของเธอ
      answer: 1
      why: กฎถาวร สกิลเป็นคู่มือย่อย
  lab-07:
    - q: โปรเจกต์จบนับจบเมื่อไร
      choices:
        - เมื่อเธอพูดว่าเสร็จ
        - เมื่อสำรวจ แผน สร้าง ดีบัก รีวิว กฎ ครบ และเทสผ่าน
        - เมื่อเปลี่ยนชื่อไฟล์เทสให้เขียว
      answer: 1
      why: จบวงจรด้วยมือตนเอง ไม่ใช่ด้วยคำพูดของเธอ
    - q: ถ้าเทสร้านค้ายังแดง แปลว่าอะไร
      choices:
        - คอร์สจบแล้ว เพราะเรียนครบบท
        - งานยังไม่จบ ต้องกลับไปหลักฐาน
        - ต้องลบเทสออก
      answer: 1
      why: เกณฑ์จบอยู่ที่ของจริง
  media-brief-evidence:
    - q: ก่อนให้เธอช่วยร่างคำ ต้องมีอะไร
      choices:
        - แท็บ Media ในตัวสลับแทร็ก
        - brief ที่คนเขียน เป้า ผู้ชม และหลักฐานที่เปิดตามได้
        - โทเคนของ Studio จริง
      answer: 1
      why: Media คือบริบทงาน คนล็อกเป้า เธอไม่ได้เป็นเจ้าของ brief
    - q: ข้อใดคือข้อเท็จจริงบนกระดานหลักฐาน
      choices:
        - ประโยคที่เธอเดาผู้ชมแล้วฟังมั่นใจ
        - คำอ้างที่ชี้พาธหรือลิงก์ที่เปิดเองได้
        - สมมติฐานที่ทีมอยากให้เป็นจริง
      answer: 1
      why: ข้อเท็จจริงต้องมีแหล่ง สมมติฐานต้องติดป้ายว่ายังไม่วัด
  media-script-storyboard:
    - q: สตอรี่บอร์ดในแล็บนี้คืออะไร
      choices:
        - ฟีเจอร์ runtime ที่พบปุ่มใน NirvaMedia Studio
        - แบบฝึกของ Academy เพราะต้นทางมีแค่คำใน mock-data
        - ระบบโพสต์อัตโนมัติสามช่องทาง
      answer: 1
      why: ไม่พบโมดูลสตอรี่บอร์ดที่รันได้ จึงสอนเป็นแบบฝึก ไม่ใช่ปุ่มผลิตภัณฑ์
    - q: สคริปต์สามช่องทางควรต่างกันอย่างไร
      choices:
        - คัดลอกประโยคเดียวแล้วเปลี่ยนโลโก้
        - LINE กระชับ Instagram โครงภาพ YouTube ลำดับเล่า
        - ให้เธอโพสต์คนละแพลตฟอร์มเลย
      answer: 1
      why: แม่แบบใน campaigns/route.ts คนละหน้าที่ต่อช่องทาง
  media-review-publish:
    - q: เมื่อคนอนุมัติแล้ว ผลที่ถูกในแล็บนี้คืออะไร
      choices:
        - published อัตโนมัติตาม STATUS_FLOW
        - คิวจำลอง blocked_auth และเธอห้ามกดเผยแพร่แทน
        - ยิง OAuth ของระบบจริง
      answer: 1
      why: ของจริงค้างที่ blocked_auth ถ้าบัญชียังไม่ connected แล็บนี้จำลองข้อนั้น
    - q: postmortem ควรบันทึกอะไร
      choices:
        - คำชมว่าเธอเก่ง
        - คนทำอะไร เธอทำอะไร คิวถูกบล็อกเพราะอะไร
        - โทเคนที่ใช้โพสต์
      answer: 1
      why: บันทึกเพื่อไม่ทำซ้ำ ไม่ใช่ใบรับรองของโมเดล
