name: Deploy study.nirva.one

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Netcup secrets
        id: check
        env:
          HOST: ${{ secrets.NETCUP_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "NETCUP_HOST is not set; skip VPS deploy"
          fi
      - name: Pull and rebuild on Netcup
        if: steps.check.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/nirva-academy
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            ./deploy/netcup/deploy.sh
