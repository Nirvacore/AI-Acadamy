name: GitHub Pages

on:
  push:
    branches: [main, cursor/thai-ai-academy-e292]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true
      - name: Enable GitHub Pages from gh-pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" \
            || gh api --method PUT "repos/${{ github.repository }}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" \
            || true
